name: Rebuild shell pages

# homegrown.html and where-the-jobs-are.html are generated from build/shell.py,
# so a change to the shell or to either generator only reaches the site once
# they are rebuilt. Nothing here needs the network: the map reads the
# jobs-map.json that "Build jobs map" already committed.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Both generators are standard library only, so there is nothing to install.
      - name: Rebuild the shell pages
        run: |
          python build/mkhomegrown.py
          python build/mkjobspage.py

      # Copy fixes that span every article page. Sixty three files carrying
      # one identical string is a scripted job, not sixty three hand edits.
      # The script is idempotent, so leaving it here costs nothing on runs
      # where the wording is already current.
      - name: Apply site wide copy fixes
        run: python build/fix_guides_cta.py

      # Every page built through build/toolgen.py inherited its head from a
      # donor that had lost its description, canonical and og tags, so 111 of
      # the 217 URLs in the sitemap carried none of them. toolgen now writes
      # those tags itself; this repairs the pages already on disk. Idempotent,
      # so it is safe to leave in the pipeline.
      - name: Repair page metadata
        run: python build/fix_page_meta.py

      # The Affiliate Policy has to be reachable from wherever a reader
      # lands, which on a site with no template layer means writing the
      # footer link into all 279 pages that have a footer. Idempotent.
      - name: Link the affiliate policy in every footer
        run: python build/add_affiliate_link.py

      # Pages built by copying a blog post's shell also copied the three
      # JSON-LD blocks that post keeps after its article, so 27 pages told
      # Google they were that article. The builders no longer copy them;
      # this clears the ones already on disk. Idempotent.
      - name: Strip borrowed structured data
        run: python build/strip_donor_schema.py

      - name: Rebuild sitemap
        run: python build/mksitemap.py

      - name: Commit if changed
        run: |
          git config user.name "shellpages-bot"
          git config user.email "actions@github.com"
          # The metadata repair touches pages across the whole tree, so
          # naming paths here would mean maintaining a list that goes
          # stale. The runner starts from a clean checkout and only these
          # scripts have run, so everything changed is intended.
          git add -A
          if git diff --cached --quiet; then
            echo "No change."
            exit 0
          fi
          git commit -m "Rebuild shell pages ($(date -u +%Y-%m-%d))"
          # Someone editing the repo mid-run should not cost the whole build.
          git pull --rebase --autostash
          git push
