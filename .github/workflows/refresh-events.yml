name: Refresh events

on:
  schedule:
    - cron: "0 11 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape
        run: python scrape_events.py

      - name: Commit if changed
        run: |
          if git diff --quiet events.json; then
            echo "No change."
            exit 0
          fi
          git config user.name "events-bot"
          git config user.email "actions@github.com"
          git add events.json
          git commit -m "Refresh events ($(date -u +%Y-%m-%d))"
          git push
