name: Refresh events

on:
  schedule:
    - cron: "0 11 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "refresh rebuilds events.json and the page. probe only reports what every source returns and writes nothing."
        type: choice
        options: [refresh, probe]
        default: refresh
      allow_shrink:
        description: "Write even when the result is smaller than the file already published"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Probe reads every source and reports what it returns without touching
      # events.json. Run this after editing sources.json, and run it from here
      # rather than from a laptop: the runner IP and headers are what the
      # weekly job actually uses, so a source that works locally but 403s in CI
      # shows up where it matters.
      - name: Probe sources
        if: ${{ inputs.mode == 'probe' }}
        run: python scrape_events.py --probe

      - name: Scrape
        if: ${{ inputs.mode != 'probe' }}
        run: python scrape_events.py ${{ inputs.allow_shrink && '--allow-shrink' || '' }}

      # events.html is drawn entirely by JavaScript, so a crawler that does not
      # run scripts sees a page with no events on it. This writes the next few
      # weeks into the HTML as a plain list with Event structured data beside
      # it, and keeps the page copy honest about in-person and cost.
      - name: Rebuild page copy and structured data
        if: ${{ inputs.mode != 'probe' }}
        run: python build_events_seo.py

      - name: Commit if changed
        if: ${{ inputs.mode != 'probe' }}
        run: |
          git config user.name "events-bot"
          git config user.email "actions@github.com"
          # assets/ is staged too: pulling the inlined images and font out of
          # the HTML writes new files there, and an untracked file is invisible
          # to git diff, so staging first is what makes the check honest.
          git add events.json events.html sitemap.xml llms.txt assets
          if git diff --cached --quiet; then
            echo "No change."
            exit 0
          fi
          git commit -m "Refresh events ($(date -u +%Y-%m-%d))"
          # Someone editing the repo while this job runs used to make the push
          # fail outright and lose the whole refresh. Rebasing onto whatever
          # landed first costs a second and saves the run.
          git pull --rebase --autostash
          git push
