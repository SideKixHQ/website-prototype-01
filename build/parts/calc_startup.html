<div class="calc" id="startup">
<div><h2>What will it cost to start?</h2>
<p class="cdek">One-time setup costs, plus the running costs to cover before revenue arrives. The months figure is the cushion you are planning for.</p>
<div class="crow"><label for="s_reg">Registration, licenses and permits</label><span class="cin"><span class="cu">$</span><input id="s_reg" inputmode="decimal" min="0" step="any" type="number" value="500"/></span></div>
<div class="crow"><label for="s_equip">Equipment and hardware</label><span class="cin"><span class="cu">$</span><input id="s_equip" inputmode="decimal" min="0" step="any" type="number" value="1200"/></span></div>
<div class="crow"><label for="s_web">Website and branding</label><span class="cin"><span class="cu">$</span><input id="s_web" inputmode="decimal" min="0" step="any" type="number" value="800"/></span></div>
<div class="crow"><label for="s_stock">Initial stock or materials</label><span class="cin"><span class="cu">$</span><input id="s_stock" inputmode="decimal" min="0" step="any" type="number" value="0"/></span></div>
<div class="crow"><label for="s_pro">Legal and accounting setup</label><span class="cin"><span class="cu">$</span><input id="s_pro" inputmode="decimal" min="0" step="any" type="number" value="600"/></span></div>
<div class="crow"><label for="s_rent">Rent or workspace<span class="chint">per month</span></label><span class="cin"><span class="cu">$</span><input id="s_rent" inputmode="decimal" min="0" step="any" type="number" value="0"/></span></div>
<div class="crow"><label for="s_tools">Software and subscriptions<span class="chint">per month</span></label><span class="cin"><span class="cu">$</span><input id="s_tools" inputmode="decimal" min="0" step="any" type="number" value="120"/></span></div>
<div class="crow"><label for="s_ins">Insurance<span class="chint">per month</span></label><span class="cin"><span class="cu">$</span><input id="s_ins" inputmode="decimal" min="0" step="any" type="number" value="60"/></span></div>
<div class="crow"><label for="s_mkt">Marketing<span class="chint">per month</span></label><span class="cin"><span class="cu">$</span><input id="s_mkt" inputmode="decimal" min="0" step="any" type="number" value="200"/></span></div>
<div class="crow"><label for="s_other">Everything else<span class="chint">per month</span></label><span class="cin"><span class="cu">$</span><input id="s_other" inputmode="decimal" min="0" step="any" type="number" value="150"/></span></div>
<div class="crow"><label for="s_months">Months of runway to plan for<span class="chint">before revenue covers costs</span></label><span class="cin"><span class="cu">#</span><input id="s_months" inputmode="decimal" min="0" step="any" type="number" value="6"/></span></div>
</div>
<aside class="cout"><p class="col">Total to get started</p><p class="cov" id="s_out"></p><p class="cos" id="s_sub"></p><dl><dt>One-time setup</dt><dd id="s_one"></dd><dt>Monthly running costs</dt><dd id="s_mo"></dd><dt>Runway subtotal</dt><dd id="s_run"></dd></dl><button class="ccopy" data-k="s" type="button">Copy this result</button></aside>
</div>
